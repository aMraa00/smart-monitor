; ---------------------------------------------------------------------------
; smart_monitor_v1 - ESP32 firmware build configuration
;
;   pio run                 build
;   pio run -t upload       flash (auto-detects the serial port)
;   pio device monitor      serial console @115200
;
; PlatformIO is the supported toolchain: the source lives in the module folders
; declared by ARCHITECTURE.md §22 (sensors/ services/ hal/ net/), which the
; Arduino IDE sketch builder does NOT compile recursively.
; ---------------------------------------------------------------------------

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Keep the binary small and the loop predictable.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
    -Wall
    -Wno-missing-field-initializers

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.15
    adafruit/Adafruit BMP085 Library@^1.2.4
    claws/BH1750@^1.3.0
    adafruit/Adafruit CCS811 Library@^1.1.3

; SD + portal web server are part of the Arduino core - no lib_deps needed.
; Wiring for the SD card (VSPI): CS=5 SCK=18 MISO=19 MOSI=23 (see config.h).
